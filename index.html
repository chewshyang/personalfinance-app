<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Finance</title>

  <!-- PWA: installable via Safari → Share → Add to Home Screen -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Finance" />

  <link rel="preload" as="image" href="icons/brand.png" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://bvyqiapgkgetifwgrpuo.supabase.co" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- The splash paints before anything else loads; React's Splash (app.jsx) renders the same markup. -->
  <style>
    html, body { margin: 0; background: #fff; }
    .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; background: #fff; font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    .splash-logo { width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 8px 24px rgba(0,0,0,.12); animation: splash-breathe 1.8s ease-in-out infinite; }
    .splash-logo.still { animation: none; }
    .splash-text { font-size: 15px; font-weight: 500; color: #5d5d5d; }
    .splash-bar { width: 88px; height: 3px; border-radius: 3px; background: #ececec; overflow: hidden; }
    .splash-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #0d0d0d; animation: splash-slide 1.15s cubic-bezier(.65,0,.35,1) infinite; }
    .splash-err { max-width: 300px; font-size: 13px; line-height: 1.45; color: #8e8e8e; }
    .splash-retry { margin-top: 6px; height: 40px; padding: 0 20px; border: 0; border-radius: 999px; background: #0d0d0d; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    @keyframes splash-breathe { 50% { transform: scale(1.05); } }
    @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .splash-logo, .splash-bar i { animation: none; } }
  </style>

  <link rel="stylesheet" href="design-system/tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div id="root">
    <div class="splash" role="status" aria-live="polite">
      <img src="icons/brand.png" alt="" width="72" height="72" class="splash-logo" />
      <div class="splash-text">Loading your numbers</div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>

  <script>
    // Shown if the app can't start at all (no network on first open, or a broken deploy).
    window.bootFailed = function (msg) {
      var root = document.getElementById("root");
      root.innerHTML = '<div class="splash" role="alert"><img src="icons/brand.png" alt="" width="72" height="72" class="splash-logo still">' +
        '<div class="splash-text">Couldn’t start the app</div><div class="splash-err"></div>' +
        '<button class="splash-retry" onclick="location.reload()">Try again</button></div>';
      root.querySelector(".splash-err").textContent = msg;
    };
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="logos/stocks/index.js"></script>
  <script src="net.js"></script>

  <script src="app.js?v=0867bf7cfb"></script>
  <script>
    try { window.bootApp(); }
    catch (err) { console.error("boot error", err); window.bootFailed((err && err.message) || String(err)); }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      // A new version took over (skipWaiting + clients.claim): reload once to use it.
      // Skipped on the very first visit, when there was no previous version.
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded || !hadController) return;
        reloaded = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
